name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Manually runnable, so a suspected flake can be stress-tested without
  # pushing an empty commit to provoke it.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pip install -e .
      # The suite is entirely offline against saved fixtures, so CI never
      # sends traffic to PSX -- a test run must not cost them anything.
      - run: python -m pytest -q
