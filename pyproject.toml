[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "psx-dps"
version = "0.1.0"
description = "Unofficial Python client and CLI for the Pakistan Stock Exchange data portal (dps.psx.com.pk)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Umair Aslam Sandhu" }]
keywords = ["psx", "pakistan", "stock-exchange", "kse100", "finance", "market-data"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/umairsandhu/psx-dps"
Issues = "https://github.com/umairsandhu/psx-dps/issues"

[project.scripts]
psx-dps = "psx_dps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
